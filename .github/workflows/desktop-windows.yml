name: native-desktop-windows
on:
  push:
    branches: [vector/desktop-rc5]
    paths: ["desktop/**", ".github/workflows/desktop-windows.yml", ".gitattributes"]
  pull_request:
    paths: ["desktop/**", ".github/workflows/desktop-windows.yml", ".gitattributes"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-2025
    timeout-minutes: 25
    env:
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen
      PYTHONPATH: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
          cache-dependency-path: desktop/requirements*.txt
      - name: Install native widgets and packager
        run: python -m pip install -r desktop/requirements-build.txt
      - name: Windows native desktop and transport tests
        run: python -m unittest discover -s desktop/tests -v
      - name: Build native Windows executable
        run: python desktop/build_app.py
      - name: Package, extract and verify the delivered application
        run: python desktop/package_windows.py
      - name: Verify source double-click launcher in a spaced Unicode path
        run: python desktop/check_windows_launcher.py
      - name: Upload Windows application and checksums
        uses: actions/upload-artifact@v4
        with:
          name: Vector-Windows-x64
          path: desktop/release/*
          if-no-files-found: error
          retention-days: 30
