{% extends "base.html" %}{% block title %}注销账户 · 交易研究平台{% endblock %}
{% block content %}<section class="auth-layout"><div class="auth-card card"><h1>注销账户</h1><div class="alert"><p>此操作会停用并匿名化账户、撤销所有会话及清理可删除的研究数据。进行中的任务必须先终止。安全审计依法或依平台保留政策保存；备份数据会按保留周期到期清除。</p></div><p>建议先<a href="{% url 'accounts:export' %}">导出个人数据</a>。</p><form method="post">{% csrf_token %}{{ form.as_p }}<p><label for="confirm-delete">输入 DELETE 确认注销</label><input id="confirm-delete" name="confirm" autocomplete="off" required></p><button class="button button-danger" type="submit">永久关闭账户</button></form></div></section>{% endblock %}
