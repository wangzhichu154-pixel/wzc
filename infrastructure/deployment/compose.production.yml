# Docker Compose >= 2.24.4 is required for !override.
# A prebuilt, tested image must exist. Do not build unreviewed code during release.
services:
  backend:
    environment:
      APP_ENV: production
      DJANGO_DEBUG: "false"
      DJANGO_SECURE_SSL_REDIRECT: "true"
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; r=urllib.request.Request('http://127.0.0.1:8000/health/ready/', headers={'X-Forwarded-Proto':'https'}); urllib.request.urlopen(r, timeout=3)"]
  migrate:
    environment:
      APP_ENV: production
      DJANGO_DEBUG: "false"
      DJANGO_SECURE_SSL_REDIRECT: "true"
  worker:
    environment:
      APP_ENV: production
      DJANGO_DEBUG: "false"
      DJANGO_SECURE_SSL_REDIRECT: "true"
  scheduler:
    environment:
      APP_ENV: production
      DJANGO_DEBUG: "false"
      DJANGO_SECURE_SSL_REDIRECT: "true"
  nginx:
    ports: !override ["80:8080", "443:8443"]
    volumes:
      - ./infrastructure/nginx/production.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_CERT_DIR:?Set TLS_CERT_DIR to an existing certificate directory}:/etc/nginx/tls:ro
