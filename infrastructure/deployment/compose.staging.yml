# Use with the base file; isolated staging project name, env file and volumes required.
services:
  backend:
    environment: {APP_ENV: staging, DJANGO_DEBUG: "false", DJANGO_SECURE_SSL_REDIRECT: "true"}
  worker:
    environment: {APP_ENV: staging, DJANGO_DEBUG: "false", DJANGO_SECURE_SSL_REDIRECT: "true"}
  scheduler:
    environment: {APP_ENV: staging, DJANGO_DEBUG: "false", DJANGO_SECURE_SSL_REDIRECT: "true"}
  migrate:
    environment: {APP_ENV: staging, DJANGO_DEBUG: "false", DJANGO_SECURE_SSL_REDIRECT: "true"}
  nginx:
    ports: !override ["80:8080", "443:8443"]
    volumes:
      - ./infrastructure/nginx/production.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_CERT_DIR:?Set TLS_CERT_DIR to the staging certificate directory}:/etc/nginx/tls:ro
