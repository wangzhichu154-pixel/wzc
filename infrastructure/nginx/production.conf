server_tokens off;
map $http_upgrade $connection_upgrade { default upgrade; '' close; }
limit_req_zone $binary_remote_addr zone=ip_requests:10m rate=20r/s;
log_format safe '$remote_addr $request_method $status $body_bytes_sent $request_time $upstream_response_time $request_id';
resolver 127.0.0.11 valid=5s ipv6=off;
upstream trading_backend {
    zone trading_backend 64k;
    server backend:8000 resolve;
    keepalive 16;
}

server {
    listen 8080;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 8443 ssl;
    http2 on;
    server_name _;
    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    access_log /dev/stdout safe;
    error_log /dev/stderr warn;
    client_max_body_size 64k;
    client_body_timeout 30s;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    location = /metrics/ { deny all; }
    location /media/ { deny all; }
    location /private-media/ { deny all; }
    location /static/ { alias /srv/static/; expires 1h; access_log off; }
    location ~ ^/(datasets|api/v1/datasets)/$ {
        client_max_body_size 257m;
        proxy_request_buffering off;
        include /etc/nginx/trading-proxy.conf;
    }
    location ~ ^/accounts/(verify/[^/]+/|password/reset/[^/]+/)$ {
        error_log /dev/null crit;
        include /etc/nginx/trading-proxy.conf;
    }
    location / { include /etc/nginx/trading-proxy.conf; }
}
