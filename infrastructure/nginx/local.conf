server_tokens off;
map $http_upgrade $connection_upgrade { default upgrade; '' close; }
limit_req_zone $binary_remote_addr zone=ip_requests:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=auth_requests:10m rate=10r/m;
log_format safe '$remote_addr $request_method $status $body_bytes_sent $request_time $upstream_response_time $request_id';
# Docker changes the backend IP on replacement. Resolve it throughout runtime.
resolver 127.0.0.11 valid=5s ipv6=off;
upstream trading_backend {
    zone trading_backend 64k;
    server backend:8000 resolve;
    keepalive 16;
}

server {
    listen 8080;
    server_name localhost;
    access_log /dev/stdout safe;
    error_log /dev/stderr warn;
    client_max_body_size 64k;
    client_body_timeout 30s;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    location = /metrics/ { deny all; }
    location /media/ { deny all; }
    location /private-media/ { deny all; }
    location /static/ {
        alias /srv/static/;
        expires 1h;
        access_log off;
    }
    location ~ ^/(datasets|api/v1/datasets)/$ {
        client_max_body_size 257m;
        proxy_request_buffering off;
        include /etc/nginx/trading-proxy.conf;
    }
    location ~ ^/accounts/(verify/[^/]+/|password/reset/[^/]+/)$ {
        # Nginx errors may embed raw URI; application logs use canonical routes.
        error_log /dev/null crit;
        include /etc/nginx/trading-proxy.conf;
    }
    location / { include /etc/nginx/trading-proxy.conf; }
}
